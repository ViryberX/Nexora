services:
  - type: web
    name: nexora-ai
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run dev:server
    envVars:
      - key: NODE_ENV
        value: production
      - key: RENDER
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
